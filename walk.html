<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>經營島 · 小島走走版</title>
<meta name="description" content="Kotter 變革八步驟 3D 小島闖關：8 週、8 個地點、8 個決定">
<meta name="theme-color" content="#2E7FE0">
<style>
:root{--bg:#FFF7EA;--surface:#FFFFFF;--surface-2:#FFF1DA;--ink:#123A73;--text:#2B2F3A;--muted:#5D6472;--line:#F0DEC2;--primary:#1F6FD1;--ok:#14866D;--ok-soft:#DDF5EC;--alert:#D6334B;--alert-soft:#FFE8EB;--warn:#B86E00;--warn-soft:#FFF0D2;--teal:#12887A;--sky1:#5DB7FF;--sky2:#2E7FE0;
 --font:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Heiti TC",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{background:#9FD8FF;color:var(--text);font-family:var(--font);font-size:20px;line-height:1.6}
button,input{font:inherit;color:inherit}
#world{position:fixed;inset:0;display:block;width:100vw;height:100vh;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font-weight:800;pointer-events:none}
.lb.bld{background:rgba(255,255,255,.94);color:#123A73;border-radius:12px;padding:2px 10px;font-size:16px;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.lb.bld i{font-style:normal;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#123A73;color:#fff;font-size:13px;margin-right:6px;vertical-align:1px}
.lb.bld.now{background:#FFB020;color:#4A2A00}.lb.bld.now i{background:#4A2A00}
.lb.bld.done{background:#DDF5EC;color:#14866D}.lb.bld.done i{background:#14866D}
.lb.nm{color:#fff;font-size:14px;text-shadow:0 1px 3px rgba(0,0,0,.85)}
.lb.bang{width:38px;height:38px;border-radius:50%;background:#FFB020;color:#5A3300;font-size:24px;display:grid;place-items:center;border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.3);animation:bob 1s ease-in-out infinite}
.lb.say{background:#fff;color:#2B2F3A;border-radius:14px;padding:6px 12px;font-size:16px;font-weight:700;max-width:230px;white-space:normal;box-shadow:0 3px 10px rgba(0,0,0,.25);animation:popin .25s ease-out}
.lb.say::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top-color:#fff}
@keyframes bob{50%{transform:translate(-50%,-115%)}}@keyframes popin{from{opacity:0;transform:translate(-50%,-80%) scale(.8)}}
#arrow{position:fixed;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:#FFB020;border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.3);display:none;place-items:center;pointer-events:none;z-index:4}
#arrow i{display:block;width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:18px solid #5A3300}
#arrow b{position:absolute;top:56px;left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(18,58,115,.9);color:#fff;font-size:15px;border-radius:10px;padding:1px 8px}
.hud{position:fixed;left:0;right:0;top:0;z-index:5;background:linear-gradient(180deg,var(--sky1),var(--sky2));color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 14px 10px;box-shadow:0 4px 16px rgba(18,58,115,.25)}
.hrow{display:flex;align-items:center;gap:8px;max-width:720px;margin:0 auto}
.pill{background:#fff;color:#1F6FD1;font-weight:800;border-radius:999px;padding:3px 12px;font-size:17px;white-space:nowrap}
.when{font-weight:800;font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{background:#FFE6A8;color:#7A4A00;border-radius:999px;padding:1px 10px;font-size:16px;font-weight:800;white-space:nowrap}
.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:720px;margin:8px auto 0}
.bar{font-size:16px;font-weight:800;position:relative}
.bar .tr{height:12px;border-radius:8px;background:rgba(255,255,255,.35);overflow:hidden;margin-top:2px}
.bar .tr i{display:block;height:100%;border-radius:8px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.a i{background:#FFC24D}.bar.b i{background:#FF8FA0}.bar.c i{background:#7EE0B8}
.bar b{float:right}
.fx{position:absolute;right:0;top:-6px;font-size:16px;font-weight:900;background:#fff;border-radius:10px;padding:0 8px;animation:fx 1.8s forwards;pointer-events:none}
.fx.up{color:var(--ok)}.fx.dn{color:var(--alert)}
@keyframes fx{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.task{max-width:720px;margin:8px auto 0;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.96);color:#123A73;border-radius:14px;padding:6px 12px;font-size:17px;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.task span{flex:1;min-width:0}
#hint{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(18,58,115,.88);color:#fff;border-radius:999px;padding:6px 16px;font-size:16px;z-index:3;pointer-events:none;transition:opacity .6s;white-space:nowrap}
#act{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:4;min-height:60px;padding:0 28px;border-radius:999px;border:4px solid #fff;background:#FF9F1C;color:#fff;font-size:21px;font-weight:900;box-shadow:0 5px 0 #C46F00,0 10px 24px rgba(0,0,0,.25);display:none;cursor:pointer;white-space:nowrap;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.05)}}
#dim{position:fixed;inset:0;background:rgba(10,20,40,.35);z-index:6;opacity:0;pointer-events:none;transition:opacity .4s}
#dim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:7;max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);border-radius:26px 26px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.35);transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#sheet.open{transform:none}
#sheet.full{top:0;max-height:none;border-radius:0}
#sheet .grab{width:48px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 0}
main{max-width:720px;margin:0 auto;padding:16px 16px calc(34px + env(safe-area-inset-bottom))}
h1{font-size:40px;line-height:1.2;color:var(--ink);margin:8px 0 2px;text-align:center;font-weight:900}
h2{font-size:28px;line-height:1.3;color:var(--ink);margin:6px 0;font-weight:900}
h3{font-size:22px;color:var(--ink);margin:4px 0;font-weight:900}
.sub{color:#E8590C;font-weight:900;text-align:center;font-size:20px;margin:0}
.card{background:var(--surface);border-radius:20px;padding:14px 16px;margin-top:12px;box-shadow:0 2px 0 rgba(18,58,115,.06),0 10px 24px -8px rgba(18,58,115,.22)}
.muted{color:var(--muted);font-size:17px}
.note{color:var(--muted);font-size:16px;text-align:center;margin:12px 0 0}
.hero{border-radius:22px;overflow:hidden;background:linear-gradient(160deg,#5DB7FF,#2E7FE0);height:150px;display:grid;place-items:center;color:#fff;font-size:64px;box-shadow:0 10px 24px -8px rgba(18,58,115,.35)}
.vcard{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:20px;padding:14px;margin-top:12px;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.vcard:active{transform:translateY(2px);box-shadow:none}
.vcard .av{flex:none;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:34px}
.vcard .tag{display:inline-block;font-size:15px;font-weight:800;border-radius:999px;padding:0 10px}
.vcard h3{margin:2px 0}.vcard p{margin:0;font-size:17px;color:var(--muted);line-height:1.5}
.row{display:grid;grid-template-columns:5.5em 1fr;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:18px}
.row:last-child{border:0}.row b{color:var(--ink)}.row small{display:block;color:var(--muted);font-size:15px}
.rules div{padding:6px 0;font-size:18px}.rules b{color:var(--teal)}
.big{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:60px;margin-top:16px;border-radius:999px;border:0;background:var(--primary);color:#fff;font-size:21px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #1553A3;text-decoration:none}
.big.ghost{background:var(--surface);color:var(--primary);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.big.orange{background:#FF9F1C;box-shadow:0 4px 0 #C46F00}
.wk{text-align:center;padding-top:6px}
.wk .n{font-size:52px;font-weight:900;color:var(--primary);line-height:1.1}
.wk .st{font-size:24px;font-weight:900;color:var(--ink)}
.wk .en{font-size:16px;color:var(--muted)}
.dots{display:flex;justify-content:center;gap:8px;margin:12px 0 4px}
.dots span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:16px;font-weight:900;background:var(--surface-2);color:#B08A5A}
.dots span.ok{background:var(--ok-soft);color:var(--ok)}.dots span.on{background:var(--primary);color:#fff}
.who{display:flex;gap:12px;align-items:flex-start}
.face{flex:none;width:56px;height:56px;border-radius:50%;background:#123A73;color:#fff;display:grid;place-items:center;font-weight:900;font-size:18px}
.who small{display:block;color:var(--muted);font-size:15px}
.q{font-size:20px;font-weight:700;color:var(--text)}
.event{margin-top:10px;background:var(--warn-soft);border-left:5px solid var(--warn);border-radius:12px;padding:8px 12px;font-size:18px}
.event b{color:var(--warn)}
.opt{display:flex;gap:10px;width:100%;text-align:left;margin:12px 0 0;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-size:19px;font-weight:600;cursor:pointer;min-height:58px;box-shadow:0 3px 0 var(--line)}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;background:var(--surface-2);color:var(--ink);display:grid;place-items:center;font-weight:900;font-size:16px}
.opt:active{transform:translateY(2px);box-shadow:none}
.opt.good{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--alert-soft);border-color:var(--alert);color:var(--alert)}
.opt.dim{opacity:.45}.opt:disabled{cursor:default}
.res{margin-top:14px;border-radius:16px;padding:12px 14px;font-size:18px}
.res.ok{background:var(--ok-soft)}.res.no{background:var(--alert-soft)}
.res h3{margin:0 0 4px}.res.ok h3{color:var(--ok)}.res.no h3{color:var(--alert)}
.delta{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.delta span{border-radius:999px;padding:0 10px;font-weight:900;font-size:16px;background:#fff}
.delta .up{color:var(--ok)}.delta .dn{color:var(--alert)}.delta .eq{color:var(--muted)}
.tip{margin-top:10px;background:var(--surface);border-radius:14px;padding:10px 14px;font-size:18px;border-left:5px solid var(--teal)}
.tip b{color:var(--teal)}.tip.ask{border-color:#C00000}.tip.ask b{color:#C00000}
.grade{text-align:center}.grade .big2{font-size:34px;font-weight:900;color:var(--primary);line-height:1.25}
.recap{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.recap div{background:var(--surface);border-radius:12px;padding:6px 10px;font-size:16px}
.recap .ok{color:var(--ok)}.recap .no{color:var(--alert)}
.field label{display:block;font-size:16px;font-weight:800;color:var(--ink)}
.field input{width:100%;border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-size:19px;background:#fff;margin-top:2px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
code{display:block;font-size:15px;background:var(--surface-2);border-radius:10px;padding:8px 10px;margin-top:10px;word-break:break-all}
#fallback{display:none;position:fixed;inset:0;background:var(--bg);z-index:9;padding:40px 24px;text-align:center;font-size:20px}
@media (max-width:380px){h1{font-size:34px}.g2{grid-template-columns:1fr}}
</style>
</head>
<body>
<canvas id="world"></canvas>
<div id="labels"></div>
<div id="arrow"><i></i><b></b></div>
<header class="hud" id="hud" hidden>
 <div class="hrow"><span class="pill" id="wkp"></span><span class="when" id="wkt"></span><span class="score" id="sc"></span></div>
 <div class="bars" id="bars"></div>
 <div class="task" id="task"><span id="taskTxt"></span></div>
</header>
<div id="hint">點地面走路；走到發光的人旁邊就能對話</div>
<button id="act" type="button"></button>
<div id="dim"></div>
<div id="sheet" aria-live="polite"><div class="grab"></div><main id="stage"></main></div>
<div id="fallback">這支手機的瀏覽器無法顯示 3D 畫面。<br><br><a class="big" href="index.html">改玩電影劇情版</a></div>
<script src="vendor/three.min.js"></script>
<script>
"use strict";
const DAYS = [
 {n:1,place:'主管會議室', time:'08:30', step:'建立危機意識', en:'Create a Sense of Urgency', who:'醫療部主任',
  ask:'你是在製造恐懼，還是用真實數據建立共同的使命？',
  lite:{who:'單位主管', say:'晨會上，單位主管轉達院長在主管會議提出的數據：急診待床 18 小時、病床周轉 6 小時。有同事小聲說：「那是急診的事。」你會怎麼接？', opts:[{t:'「對啊，跟我們病房無關，先把自己的事做好。」', d:[-5,0,-2], r:'把問題切割給別的單位，危機意識無法在單位內形成。', ok:false},{t:'「上週那位在急診等了一整晚才上來的病人，我們接手時也很累。流程卡在哪裡，我們最清楚。」', d:[12,6,2], r:'用自己單位的真實經驗說出必要性，同事才會覺得這件事與自己有關。', ok:true},{t:'「等上面定案再說，現在講也沒用。」', d:[-3,-2,-2], r:'等待決策，迫切性隨時間消失。', ok:false}]},
  say:'院長，急診待床平均 18 小時、病床周轉 6 小時，病人抱怨這季又增加了。主管會議您打算怎麼開場？',
  pro:'（Pro）會議前，急診主任私下提醒：有兩位資深主治認為「這是急診自己的問題」。',
  opts:[
   {t:'「再這樣下去會被衛生局處分，各單位限期改善。」', d:[+5,-12,+3], r:'用處分施壓，短期有動作，長期增加防衛與觀望。', ok:false},
   {t:'「同仁很努力，但流程讓病人等太久，也讓第一線更累。要改的是流程，不是努力程度。」', d:[+15,+8,+2], r:'以數據、病人經驗與共同使命建立迫切性，不製造恐懼。', ok:true},
   {t:'「先成立委員會研議，下一季再討論。」', d:[-5,0,-3], r:'延後處理，迫切性隨時間消失。', ok:false}]},
 {n:2,place:'院長室', time:'10:00', step:'組成變革領導團隊', en:'Build a Guiding Coalition', who:'副院長',
  ask:'你的變革團隊只是開會的委員會，還是有協調資源與排除障礙權力的決策核心？',
  lite:{who:'單位主管', say:'單位主管問：院方要成立跨部門的病床管理小組，每個單位要一位變革種子。誰願意？', opts:[{t:'推給最資深的學姐，她比較懂。', d:[0,-3,0], r:'只靠資深者，單位其他人仍是旁觀者。', ok:false},{t:'自願參加，並找一位白班、一位夜班同事一起，讓三班都有人能回饋。', d:[10,6,3], r:'變革團隊要有第一線的聲音，而且要能把訊息帶回單位。', ok:true},{t:'參加，但只去開會、不把討論帶回單位。', d:[2,-2,0], r:'有名無實的代表，單位仍不知道改革在做什麼。', ok:false}]},
  say:'改革要有人帶。您想怎麼組這個團隊？',
  pro:'（Pro）通資組同時有 HIS 升級案在跑，護理部主任同時兼評鑑窗口。',
  opts:[
   {t:'由我親自主持，各單位主管每週來報告。', d:[+3,-5,+2], r:'只靠院長推動，單點決策，主管更換就停。', ok:false},
   {t:'交給醫品中心承辦，寫成專案計畫書即可。', d:[0,-3,0], r:'單一部門無法協調跨部門資源與權責。', ok:false},
   {t:'由副院長召集，護理部、急診、臨床科、通資組、醫品中心、人資行政組都進來，指定專案負責人。', d:[+12,+6,+4], r:'跨部門、有決策力與影響力的領導團隊，能協調資源與排除障礙。', ok:true}]},
 {n:3,place:'策略工作坊', time:'13:30', step:'建立策略願景', en:'Form a Strategic Vision', who:'專案負責人',
  ask:'員工看到的是冰冷的 KPI，還是值得追隨的清晰未來？',
  lite:{who:'專案負責人', say:'小組請每個單位寫出「理想的住院流程長什麼樣」，下週工作坊討論。你會怎麼寫？', opts:[{t:'直接抄另一家醫院的 SOP 交出去。', d:[2,-4,1], r:'未依本院病人組成與資源調整，同事認為不切實際。', ok:false},{t:'用病房的真實案例描述理想狀況，並提出可量的目標，例如出院到清床完成的時間。', d:[10,5,5], r:'願景要清楚、可轉成具體目標，第一線的描述最能說服人。', ok:true},{t:'寫「盡力而為、持續改善」交差。', d:[-3,0,-4], r:'沒有可衡量目標，改革無法判斷是否有效。', ok:false}]},
  say:'團隊問：我們到底要把醫院變成什麼樣子？目標要怎麼訂？',
  pro:'（Pro）總院希望本院一年內待床時間降到 8 小時以下，本院基準值是 18 小時。',
  opts:[
   {t:'願景：以病人為中心、即時透明、高效率且安全的智慧住院流程；一年目標依本院基準值設定、每季衡量。', d:[+10,+5,+6], r:'願景清楚、可轉成具體目標；數值依基準值設定，KPI 衡量成敗。', ok:true},
   {t:'先不訂數字，做了再說。', d:[-4,+2,-5], r:'沒有可衡量目標，無法判斷改革是否有效。', ok:false},
   {t:'直接套用醫學中心的指標目標值。', d:[+2,-6,+1], r:'未依病人組成與資源條件調整，第一線認為不切實際。', ok:false}]},
 {n:4,place:'護理站', time:'15:00', step:'凝聚支持與參與', en:'Enlist a Volunteer Army', who:'病房護理長',

 if(target&&INPUT){const ex=target.x-player.position.x,ez=target.z-player.position.z,d=Math.hypot(ex,ez);let done=d<.25;
  if(target.talk&&target.talk!=='host'){const p=people[target.talk];if(Math.hypot(p.position.x-player.position.x,p.position.z-player.position.z)<1.6)done=true}
  if(target.talk==='host'&&nearHost(1.7))done=true;
  if(done){const tg=target;target=null;if(tg.talk==='host')arriveHost();else if(tg.talk){const p=people[tg.talk];p.rotation.y=Math.atan2(player.position.x-p.position.x,player.position.z-p.position.z);const w=p.userData.w;say(tg.talk,w.idle[Math.floor(Math.random()*w.idle.length)])}}else{dx=ex/d;dz=ez/d}}
 const moving=!!(dx||dz);if(moving){const sp=5.4*dt;if(!step(player,dx*sp,dz*sp)){if(++stuck>25){target=null;stuck=0}}else stuck=0;player.rotation.y=Math.atan2(dx,dz)}
 anim(player,moving,t);
 for(const k in people){if(k[0]==='_'||k==='host')continue;const p=people[k],u=p.userData,w=u.w;
  if(u.say){anim(p,false,t);continue}
  if(!u.goal||Math.hypot(u.goal[0]-p.position.x,u.goal[1]-p.position.z)<.3){u.wait=(u.wait||0)-dt;anim(p,false,t);if(u.wait<=0){u.goal=[w.box[0]+Math.random()*(w.box[1]-w.box[0]),w.box[2]+Math.random()*(w.box[3]-w.box[2])];u.wait=1.5+Math.random()*3}continue}
  const ex=u.goal[0]-p.position.x,ez=u.goal[1]-p.position.z,d=Math.hypot(ex,ez),sp=1.7*dt;
  if(!step(p,ex/d*sp,ez/d*sp))u.goal=null;else{p.rotation.y=Math.atan2(ex,ez);anim(p,true,t)}}
 const b=people._boat;b.position.x+=dt*1.2;if(b.position.x>40)b.position.x=-40;b.position.y=-.1+Math.sin(t*2)*.06;
 const h=people.host,act=S.phase==='walk';h.userData.bang.show=act;ring.visible=act;
 if(act){ring.position.x=h.position.x;ring.position.z=h.position.z;ring.scale.setScalar(1+Math.sin(t*4)*.12)}
 const off=camOff();v3.set(player.position.x+off[0],off[1],player.position.z+off[2]);cam.position.lerp(v3,.08);cam.lookAt(player.position.x,0,player.position.z-(innerWidth<innerHeight?3.5:6));
 sun.position.set(player.position.x-12,24,player.position.z+14);sun.target.position.set(player.position.x,0,player.position.z);
 const ab=$('#act');if(act&&INPUT&&nearHost(2.6)){ab.textContent='💬 和'+getD(S.day).who+'說話';ab.style.display='block';$('#hint').style.opacity=0}else ab.style.display='none';
 R.render(scene,cam);
 for(const l of labels){if(!l.show){l.e.style.display='none';continue}l.obj.getWorldPosition(v3);v3.y+=l.dy;v3.project(cam);
  if(v3.z>1||v3.x<-1.2||v3.x>1.2||v3.y<-1.2||v3.y>1.2){l.e.style.display='none';continue}l.e.style.display='';l.e.style.left=((v3.x+1)/2*innerWidth)+'px';l.e.style.top=((1-v3.y)/2*innerHeight)+'px'}
 const ar=$('#arrow');
 if(act&&INPUT){v3.set(h.position.x,1,h.position.z);v3.project(cam);const sx=(v3.x+1)/2*innerWidth,sy=(1-v3.y)/2*innerHeight,m=60,top=200;
  const on=v3.z<=1&&sx>=m&&sx<=innerWidth-m&&sy>=top&&sy<=innerHeight-m;
  if(on){ar.style.display='none'}else{const cx=innerWidth/2,cy=innerHeight/2;let ax=sx-cx,ay=sy-cy;if(v3.z>1){ax=-ax;ay=-ay}const k=Math.min((innerWidth/2-m)/Math.abs(ax||1e-6),(innerHeight/2-m-40)/Math.abs(ay||1e-6));
   ar.style.display='grid';ar.style.left=(cx+ax*k)+'px';ar.style.top=Math.max(top,cy+ay*k)+'px';ar.querySelector('i').style.transform=`rotate(${Math.atan2(ay,ax)+Math.PI/2}rad)`;ar.querySelector('b').textContent=getD(S.day).place}}else ar.style.display='none';
}
let downAt=null;
$('#world').addEventListener('pointerdown',e=>{downAt=[e.clientX,e.clientY,performance.now()]});
$('#world').addEventListener('pointerup',e=>{if(!downAt||!INPUT)return;const [x,y,t0]=downAt;downAt=null;if(Math.hypot(e.clientX-x,e.clientY-y)>12||performance.now()-t0>600)return;
 mv.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mv,cam);$('#hint').style.opacity=0;
 const meshes=[];for(const k in people){if(k[0]==='_')continue;people[k].traverse(m=>{if(m.isMesh){m.userData.owner=k;meshes.push(m)}})}
 const hp=ray.intersectObjects(meshes,false)[0];
 if(hp){const id=hp.object.userData.owner,p=people[id];if(id==='host'&&nearHost(2.6)){arriveHost();return}target={x:p.position.x,z:p.position.z+1.2,talk:id};return}
 const hit=ray.intersectObject(scene.getObjectByName('ground'),false)[0];
 if(hit){// 點到建築附近 → 走到門口
  const bi=BL.findIndex(b=>Math.abs(hit.point.x-b.x)<3.6&&Math.abs(hit.point.z-b.z)<2.8);
  if(bi===S.day&&S.phase==='walk'){const h=people.host;target={x:h.position.x,z:h.position.z+1.2,talk:'host'};return}
  target={x:hit.point.x,z:hit.point.z}}});
$('#act').onclick=()=>{if(S.phase==='walk'&&nearHost(2.6))arriveHost()};
$('#dim').onclick=()=>{};
if(R){try{build();loop();titleScreen()}catch(e){console.error(e);$('#fallback').style.display='block'}}else{$('#fallback').style.display='block'}
</script>
</body>
</html>
